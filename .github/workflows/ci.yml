name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ForzaTelemetry.slnx

      - name: Build
        run: dotnet build ForzaTelemetry.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ForzaTelemetry.slnx -c Release --no-build
